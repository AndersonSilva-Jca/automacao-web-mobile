appId: br.com.autoviacao1001.autoviacao1001app
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- tapOn: "Digite seu CPF ou E-mail"
- inputText: "${LOGIN2}"
- tapOn:
    id: "password"
- inputText: "${SENHA2}"
- hideKeyboard
- tapOn: "Entrar"
- waitForAnimationToEnd
- assertVisible:
    id: "origin"
- extendedWaitUntil:
    visible: "Comprar passagens"
    timeout: 10000
- tapOn:
    id: "origin"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Origem"
    timeout: 10000
- inputText: "Sao Paulo (Todos) (SP)"
- extendedWaitUntil:
    visible: "S\u00e3o Paulo (Todos) (SP), Localidade de Grupo"
    timeout: 15000
- doubleTapOn: "S\u00e3o Paulo (Todos) (SP), Localidade de Grupo"
- tapOn:
    id: "locationSearch"
- inputText: "Rio de Janeiro (Todos)"
- extendedWaitUntil:
    visible: "Rio de Janeiro (Todos) (RJ), Localidade de Grupo"
    timeout: 15000
- tapOn: "Rio de Janeiro (Todos) (RJ), Localidade de Grupo"
- tapOn: "Rio de Janeiro (Todos) (RJ), Localidade de Grupo"
- extendedWaitUntil:
    visible: "Data"
    timeout: 10000
- assertVisible: "Data"
- extendedWaitUntil:
    visible:
      id: "calendarComponentContainer"
    timeout: 10000
# - tapOn: "1[1-9]|2[0-9]|30"
- evalScript: ${output.diaAlvo = (function() { var hoje = new Date(); var ano = hoje.getFullYear(); var mes = hoje.getMonth(); var offsetSorteado = Math.floor(Math.random() * 2); var diasNoMes = new Date(ano, mes + 1, 0).getDate(); return String(Math.min(hoje.getDate() + offsetSorteado, diasNoMes)); })()}

- evalScript: ${output.mesAnoAlvo = (function() { var meses = ["JANEIRO","FEVEREIRO","MARCO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"]; var hoje = new Date(); return meses[hoje.getMonth()] + "/" + String(hoje.getFullYear()); })()}
- extendedWaitUntil:
    visible:
      id: "calendarComponentContainer"
    timeout: 10000
- tapOn:
    text: "^${output.diaAlvo}$"
    below: "${output.mesAnoAlvo}"

- tapOn: "Confirmar"

- tapOn: "Buscar"
- extendedWaitUntil:
    visible: "Passagem de\u00a0IDA"
    timeout: 15000
- waitForAnimationToEnd
# - swipe:
#     direction: UP
# - swipe:
#     direction: UP
# - swipe:
#     direction: UP

# Rola 4 vezes para baixo para avançar na listagem
- repeat:
    times: 4
    commands:
      - scroll
      - waitForAnimationToEnd

# Garante que há um card com "a partir de" e clica no "Comprar" correspondente
- extendedWaitUntil:
    visible:
      text: "Comprar"
      below: "a partir de"
    timeout: 10000

- tapOn:
    text: "Comprar"
    below: "a partir de"

# 1. Clica no botão para comprar a passage

# 2. Verifica condicionalmente se o modal de madrugada apareceu
- runFlow:
    when:
      visible: "Atenção!"
    commands:
      - assertVisible: "Aten\u00e7\u00e3o!"
      - assertVisible: "Ok, entendi!"
      - waitForAnimationToEnd
      - tapOn: "Ok, entendi!"

- tapOn: "Adicione um passageiro salvo"
- tapOn: "Anderson Silva dos Santos"
# - tapOn: "01/01/0001"
# - eraseText
# - inputText: "14/11/1987"
- tapOn: "Avan\u00e7ar"

- assertVisible: "Passageiro 1, Anderson Silva dos Santos, Selecione o assento"
- tapOn: "Passageiro 1, Anderson Silva dos Santos, Selecione o assento"

# Sorteia um índice alto o bastante pra cobrir tanto o mapa pequeno (cama, ~4 assentos)
# quanto o grande (executivo, ~28+ assentos)
- evalScript: ${output.indiceSorteado = Math.floor(Math.random() * 30)}

- runFlow:
    when:
      visible:
        text: "^[0-9]{1,2}$"
        index: ${output.indiceSorteado}
    commands:
      - tapOn:
          text: "^[0-9]{1,2}$"
          index: ${output.indiceSorteado}

- runFlow:
    when:
      notVisible:
        text: "^[0-9]{1,2}$"
        index: ${output.indiceSorteado}
    commands:
      # O palpite estourou o total de assentos deste mapa (ex: mapa de cama, só 4) --
      # cai num índice que com certeza existe, já que o mapa de assentos está na tela
      - tapOn:
          text: "^[0-9]{1,2}$"
          index: 0
- tapOn: "Continuar "
