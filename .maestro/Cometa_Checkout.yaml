appId: br.com.viacaocometa.cometaapp
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- tapOn: "Digite seu CPF ou E-mail"
- inputText: "anderson.ssantos@jcatlm.com.br"
- tapOn:
    id: "password"
- inputText: "Kx#9mP$1"
- hideKeyboard
- tapOn: "Entrar"
- waitForAnimationToEnd
- assertVisible:
    id: "origin"
- assertVisible: "Comprar passagens"
- assertVisible: "Destino"
- assertVisible:
    id: "inputCalendarContainer"
- doubleTapOn:
    id: "origin"
- assertVisible: "Origem"
- assertVisible:
    point: 0%,10%
- inputText: "Sao Paulo (Todos)"
- extendedWaitUntil:
    visible: "S\u00e3o Paulo (Todos) (SP), Localidade de Grupo"
    timeout: 5000
- tapOn: "S\u00e3o Paulo (Todos) (SP), Localidade de Grupo"
- tapOn: "S\u00e3o Paulo (Todos) (SP), Localidade de Grupo"
- tapOn:
    id: "locationSearch"
- inputText: "Rio de Janeiro (Todos)"
- extendedWaitUntil:
    visible: "Rio de Janeiro (Todos) (RJ), Localidade de Grupo"
    timeout: 5000
- tapOn: "Rio de Janeiro (Todos) (RJ), Localidade de Grupo"
- tapOn: "Rio de Janeiro (Todos) (RJ), Localidade de Grupo"
- assertVisible: "Data"
- assertVisible:
    id: "calendarComponentContainer"
# - tapOn: "1[1-9]|2[0-9]|30"
- evalScript: ${output.diaAlvo = (function() { var hoje = new Date(); var ano = hoje.getFullYear(); var mes = hoje.getMonth(); var offsetSorteado = Math.floor(Math.random() * 2); var diasNoMes = new Date(ano, mes + 1, 0).getDate(); return String(Math.min(hoje.getDate() + offsetSorteado, diasNoMes)); })()}

- evalScript: ${output.mesAnoAlvo = (function() { var meses = ["JANEIRO","FEVEREIRO","MARCO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"]; var hoje = new Date(); return meses[hoje.getMonth()] + "/" + String(hoje.getFullYear()); })()}

- assertVisible:
    id: "calendarComponentContainer"

- tapOn:
    text: "^${output.diaAlvo}$"
    below: "${output.mesAnoAlvo}"

- tapOn: "Confirmar"

- tapOn: "Buscar"
- assertVisible: "Passagem de\u00a0IDA"
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- tapOn: "Comprar"
- tapOn: "Adicione um passageiro salvo"
- tapOn: "Anderson Silva dos Santos"
# - tapOn: "01/01/0001"
# - eraseText
# - inputText: "14/11/1987"
- tapOn: "Avan\u00e7ar"

- assertVisible: "Passageiro 1, Anderson Silva dos Santos, Selecione o assento"
- tapOn: "Passageiro 1, Anderson Silva dos Santos, Selecione o assento"
- assertVisible:
    point: 20%,41%
# Sorteia um índice alto o bastante pra cobrir tanto o mapa pequeno (cama, ~4 assentos)
# quanto o grande (executivo, ~28+ assentos)
- evalScript: ${output.indiceSorteado = Math.floor(Math.random() * 30)}

- runFlow:
    when:
      visible:
        text: "^[0-9]{1,2}$"
        index: ${output.indiceSorteado}
    commands:
      - tapOn:
          text: "^[0-9]{1,2}$"
          index: ${output.indiceSorteado}

- runFlow:
    when:
      notVisible:
        text: "^[0-9]{1,2}$"
        index: ${output.indiceSorteado}
    commands:
      # O palpite estourou o total de assentos deste mapa (ex: mapa de cama, só 4) --
      # cai num índice que com certeza existe, já que o mapa de assentos está na tela
      - tapOn:
          text: "^[0-9]{1,2}$"
          index: 0
- tapOn: "Continuar "
- assertVisible: "Digite o CUPOM"
