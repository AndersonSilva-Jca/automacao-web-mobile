name: Reprocessar Retroativo (R2 -> Apps Script)

on:
  workflow_dispatch:
    inputs:
      web_start_run:
        description: "RUN Web (Cypress) INICIAL"
        required: false
        default: "1868"
      web_end_run:
        description: "RUN Web (Cypress) FINAL"
        required: false
        default: "1987"
      mobile_start_run:
        description: "RUN Mobile (Robot) INICIAL"
        required: false
        default: "1994"
      mobile_end_run:
        description: "RUN Mobile (Robot) FINAL"
        required: false
        default: "2114"

jobs:
  reprocessar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências (xml2js)
        run: npm install xml2js

      - name: Executar Processamento Retroativo Com Datas Originais
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          CYPRESS_R2_PUBLIC_URL: ${{ secrets.CYPRESS_R2_PUBLIC_URL }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          WEB_START: ${{ github.event.inputs.web_start_run }}
          WEB_END: ${{ github.event.inputs.web_end_run }}
          MOBILE_START: ${{ github.event.inputs.mobile_start_run }}
          MOBILE_END: ${{ github.event.inputs.mobile_end_run }}
        run: |
          node -e '
          const https = require("https");
          const http = require("http");
          const { execSync } = require("child_process");
          const fs = require("fs");
          const path = require("path");
          const xml2js = require("xml2js");

          const APPS_SCRIPT_URL = process.env.APPS_SCRIPT_URL || "https://script.google.com/macros/s/AKfycby6v2p1_k9ch5st11OeBy7Nermci8fIh0Y9A4RwroXO5HdIsGDF03BUg6hgHVsFou6_1A/exec";
          const R2_BASE_WEB = (process.env.CYPRESS_R2_PUBLIC_URL || "https://pub-8f8304dd624445aca80dcb98bc5a78d0.r2.dev").replace(/\/$/, "");
          const R2_BASE_MOBILE = (process.env.R2_PUBLIC_URL || "https://pub-8f8304dd624445aca80dcb98bc5a78d0.r2.dev").replace(/\/$/, "");

          function baixarArquivo(url, destino) {
            return new Promise((resolve) => {
              const client = url.startsWith("https") ? https : http;
              const req = client.get(url, { headers: { "User-Agent": "GitHub-Actions-Retro" } }, (res) => {
                if (res.statusCode === 301 || res.statusCode === 302 || res.statusCode === 308) {
                  return baixarArquivo(res.headers.location, destino).then(resolve);
                }
                if (res.statusCode === 200) {
                  const file = fs.createWriteStream(destino);
                  res.pipe(file);
                  file.on("finish", () => {
                    file.close();
                    const stats = fs.statSync(destino);
                    // Relatórios JSON costumam ser grandes. Menos de 50 bytes pode ser um 404 mascarado.
                    if (stats.size > 50) {
                      resolve(true);
                    } else {
                      fs.unlinkSync(destino);
                      resolve(false);
                    }
                  });
                } else {
                  resolve(false);
                }
              });
              req.on("error", () => resolve(false));
              req.setTimeout(15000, () => { req.destroy(); resolve(false); });
            });
          }

          function extrairDataJsonWeb(caminhoJson) {
            try {
              const conteudo = JSON.parse(fs.readFileSync(caminhoJson, "utf-8"));
              if (conteudo.stats && conteudo.stats.start) {
                return new Date(conteudo.stats.start).toISOString();
              }
            } catch (e) {}
            return null;
          }

          async function extrairDataXmlMobile(caminhoXml) {
            try {
              const xmlData = fs.readFileSync(caminhoXml, "utf-8");
              const parser = new xml2js.Parser();
              const result = await parser.parseStringPromise(xmlData);
              const generated = result.robot?.$?.generated;
              if (generated) {
                const partes = generated.split(" ");
                const d = partes[0];
                const t = partes[1] || "00:00:00";
                return `${d.substring(0,4)}-${d.substring(4,6)}-${d.substring(6,8)}T${t}Z`;
              }
            } catch (e) {}
            return null;
          }

          async function processarWeb() {
            const start = parseInt(process.env.WEB_START, 10);
            const end = parseInt(process.env.WEB_END, 10);

            if (isNaN(start) || isNaN(end) || start > end) return;

            console.log(`\n==================================================`);
            console.log(`🌐 INICIANDO PROCESSAMENTO WEB RETROATIVO (#${start} até #${end})`);
            console.log(`==================================================`);

            for (let run = start; run <= end; run++) {
              console.log(`\n🔍 Processando Web Run #${run}...`);
              const pastaTemp = "./cypress/reports";
              fs.mkdirSync(pastaTemp, { recursive: true });
              const jsonPath = path.join(pastaTemp, "mochawesome.json"); // Usamos mochawesome por padrão

              // Expansão drástica das candidatas baseada na imagem enviada
              const candidatasUrl = [
                `${R2_BASE_WEB}/cypress-reports/reports/${run}/01_e2e/index.json`,
                `${R2_BASE_WEB}/cypress-reports/reports/${run}/01_e2e/mochawesome.json`,
                `${R2_BASE_WEB}/cypress-reports/reports/${run}/01_e2e/report.json`,
                `${R2_BASE_WEB}/reports/${run}/01_e2e/index.json`,
                `${R2_BASE_WEB}/reports/${run}/01_e2e/mochawesome.json`,
                `${R2_BASE_WEB}/reports/${run}/index.json`,
                `${R2_BASE_WEB}/reports/${run}/mochawesome.json`
              ];

              let ok = false;
              let urlSucesso = "";

              for (const url of candidatasUrl) {
                ok = await baixarArquivo(url, jsonPath);
                if (ok) {
                  urlSucesso = url;
                  break;
                }
              }

              if (ok) {
                const dataOriginal = extrairDataJsonWeb(jsonPath);
                console.log(`📦 Relatório baixado de: ${urlSucesso}`);
                console.log(`🕒 Data Original da Run #${run}: ${dataOriginal || "Data do sistema"}`);

                try {
                  // O script de ingestão precisa saber onde o arquivo está
                  execSync("node scripts/enviar-resultados-appscript.js", {
                    env: {
                      ...process.env,
                      APPS_SCRIPT_URL,
                      GITHUB_RUN_NUMBER: String(run),
                      CYPRESS_R2_PUBLIC_URL: R2_BASE_WEB,
                      REPORTS_DIR: pastaTemp,
                      RETRO_DATA: dataOriginal || ""
                    },
                    stdio: "inherit"
                  });
                } catch (e) {
                  console.error(`❌ Erro ao reenviar Web Run #${run}:`, e.message);
                }
              } else {
                console.log(`⚠️ Web Run #${run} não encontrada em nenhum dos caminhos no R2.`);
              }

              fs.rmSync(pastaTemp, { recursive: true, force: true });
            }
          }

          async function processarMobile() {
            const start = parseInt(process.env.MOBILE_START, 10);
            const end = parseInt(process.env.MOBILE_END, 10);

            if (isNaN(start) || isNaN(end) || start > end) return;

            console.log(`\n==================================================`);
            console.log(`📱 INICIANDO PROCESSAMENTO MOBILE RETROATIVO (#${start} até #${end})`);
            console.log(`==================================================`);

            for (let run = start; run <= end; run++) {
              console.log(`\n🔍 Processando Mobile Run #${run}...`);
              const pastaTemp = "./results";
              fs.mkdirSync(pastaTemp, { recursive: true });
              const xmlPath = path.join(pastaTemp, "output.xml");

              // Candidatas baseadas na imagem do allure-reports
              const candidatasUrl = [
                `${R2_BASE_MOBILE}/allure-reports/reports/mobile-run-${run}/output.xml`,
                `${R2_BASE_MOBILE}/reports/mobile-run-${run}/output.xml`,
                `${R2_BASE_MOBILE}/allure-reports/reports/${run}/output.xml`,
                `${R2_BASE_MOBILE}/reports/${run}/output.xml`
              ];

              let ok = false;
              let urlSucesso = "";

              for (const url of candidatasUrl) {
                ok = await baixarArquivo(url, xmlPath);
                if (ok) {
                  urlSucesso = url;
                  break;
                }
              }

              if (ok) {
                const dataOriginal = await extrairDataXmlMobile(xmlPath);
                console.log(`📱 Relatório baixado de: ${urlSucesso}`);
                console.log(`🕒 Data Original da Run #${run}: ${dataOriginal || "Data do sistema"}`);

                try {
                  execSync("node scripts/enviar-resultados-appscript-mobile.js", {
                    env: {
                      ...process.env,
                      APPS_SCRIPT_URL,
                      GITHUB_RUN_NUMBER: String(run),
                      R2_PUBLIC_URL: R2_BASE_MOBILE,
                      OUTPUT_XML: xmlPath,
                      RETRO_DATA: dataOriginal || ""
                    },
                    stdio: "inherit"
                  });
                } catch (e) {
                  console.error(`❌ Erro ao reenviar Mobile Run #${run}:`, e.message);
                }
              } else {
                console.log(`⚠️ Mobile Run #${run} não encontrada no R2.`);
              }

              fs.rmSync(pastaTemp, { recursive: true, force: true });
            }
          }

          async function main() {
            await processarWeb();
            await processarMobile();
            console.log(`\n🎉 Processamento retroativo concluído!`);
          }

          main();
          '
