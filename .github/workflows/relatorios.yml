name: Reprocessar Retroativo (R2 -> Apps Script)

on:
  workflow_dispatch:
    inputs:
      web_start_run:
        description: "RUN Web (Cypress) INICIAL"
        required: false
        default: "1868"
      web_end_run:
        description: "RUN Web (Cypress) FINAL"
        required: false
        default: "1987"

jobs:
  reprocessar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # A dependência xml2js foi removida porque era exclusiva do Mobile

      - name: Executar Processamento Retroativo WEB
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          CYPRESS_R2_PUBLIC_URL: ${{ secrets.CYPRESS_R2_PUBLIC_URL }}
          WEB_START: ${{ github.event.inputs.web_start_run }}
          WEB_END: ${{ github.event.inputs.web_end_run }}
        run: |
          node -e '
          const https = require("https");
          const http = require("http");
          const { execSync } = require("child_process");
          const fs = require("fs");
          const path = require("path");

          const APPS_SCRIPT_URL = process.env.APPS_SCRIPT_URL || "https://script.google.com/macros/s/AKfycby6v2p1_k9ch5st11OeBy7Nermci8fIh0Y9A4RwroXO5HdIsGDF03BUg6hgHVsFou6_1A/exec";
          const R2_BASE_WEB = (process.env.CYPRESS_R2_PUBLIC_URL || "https://pub-8f8304dd624445aca80dcb98bc5a78d0.r2.dev").replace(/\/$/, "");

          function baixarArquivo(url, destino) {
            return new Promise((resolve) => {
              const client = url.startsWith("https") ? https : http;
              const req = client.get(url, { headers: { "User-Agent": "GitHub-Actions-Retro" } }, (res) => {
                if (res.statusCode === 301 || res.statusCode === 302 || res.statusCode === 308) {
                  return baixarArquivo(res.headers.location, destino).then(resolve);
                }
                if (res.statusCode === 200) {
                  const file = fs.createWriteStream(destino);
                  res.pipe(file);
                  file.on("finish", () => {
                    file.close();
                    const stats = fs.statSync(destino);
                    // Garante que não é uma página de erro 404 vazia
                    if (stats.size > 50) {
                      resolve(true);
                    } else {
                      fs.unlinkSync(destino);
                      resolve(false);
                    }
                  });
                } else {
                  resolve(false);
                }
              });
              req.on("error", () => resolve(false));
              req.setTimeout(15000, () => { req.destroy(); resolve(false); });
            });
          }

          function extrairDataJsonWeb(caminhoJson) {
            try {
              const conteudo = JSON.parse(fs.readFileSync(caminhoJson, "utf-8"));
              if (conteudo.stats && conteudo.stats.start) {
                return new Date(conteudo.stats.start).toISOString();
              }
            } catch (e) {}
            return null;
          }

          async function processarWeb() {
            const start = parseInt(process.env.WEB_START, 10);
            const end = parseInt(process.env.WEB_END, 10);

            if (isNaN(start) || isNaN(end) || start > end) return;

            console.log(`\n==================================================`);
            console.log(`🌐 INICIANDO PROCESSAMENTO WEB RETROATIVO (#${start} até #${end})`);
            console.log(`==================================================`);

            for (let run = start; run <= end; run++) {
              console.log(`\n🔍 Processando Web Run #${run}...`);
              const pastaTemp = "./cypress/reports";
              fs.mkdirSync(pastaTemp, { recursive: true });
              const jsonPath = path.join(pastaTemp, "index.json");

              // URLs limpas baseadas no link oficial do seu R2
              const candidatasUrl = [
                `${R2_BASE_WEB}/reports/${run}/01_e2e/index.json`,
                `${R2_BASE_WEB}/reports/${run}/index.json`
              ];

              let ok = false;
              let urlSucesso = "";

              for (const url of candidatasUrl) {
                ok = await baixarArquivo(url, jsonPath);
                if (ok) {
                  urlSucesso = url;
                  break;
                }
              }

              if (ok) {
                const dataOriginal = extrairDataJsonWeb(jsonPath);
                console.log(`📦 Relatório baixado de: ${urlSucesso}`);
                console.log(`🕒 Data Original da Run #${run}: ${dataOriginal || "Data do sistema"}`);

                try {
                  execSync("node scripts/enviar-resultados-appscript.js", {
                    env: {
                      ...process.env,
                      APPS_SCRIPT_URL,
                      GITHUB_RUN_NUMBER: String(run),
                      CYPRESS_R2_PUBLIC_URL: R2_BASE_WEB,
                      REPORTS_DIR: pastaTemp,
                      RETRO_DATA: dataOriginal || ""
                    },
                    stdio: "inherit"
                  });
                } catch (e) {
                  console.error(`❌ Erro ao reenviar Web Run #${run}:`, e.message);
                }
              } else {
                console.log(`⚠️ Web Run #${run} não encontrada em nenhum dos caminhos no R2.`);
              }

              fs.rmSync(pastaTemp, { recursive: true, force: true });
            }
          }

          async function main() {
            await processarWeb();
            console.log(`\n🎉 Processamento retroativo WEB concluído!`);
          }

          main();
          '
