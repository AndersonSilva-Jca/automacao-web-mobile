name: Mobile Maestro E2E

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RESULTS_DIR: results
  R2_BUCKET: maestro-report
  R2_PUBLIC_URL: "https://pub-a4cb7123a80e4b17bcd832b985e805a6.r2.dev" # Substitua pela URL pública do bucket maestro-report

jobs:
  maestro-mobile-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Enable KVM group permissions
        run: |
          sudo chmod 666 /dev/kvm

      - name: Run Tests with Android Emulator & Maestro
        id: run_tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LOGIN: ${{ secrets.LOGIN }}
          SENHA: ${{ secrets.SENHA }}
          LOGIN2: ${{ secrets.LOGIN2 }}
          SENHA2: ${{ secrets.SENHA2 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            export PATH="$PATH:$HOME/.maestro/bin"
            echo "=== Instalando APKs ==="
            adb install-multiple ./app/apks/cometa/*.apk || true
            adb install-multiple ./app/apks/1001/*.apk || true
            adb install-multiple ./app/apks/catarinense/*.apk || true
            adb install-multiple ./app/apks/wemobi/*.apk || true

            mkdir -p $RESULTS_DIR

            echo "=== Executando Maestro com gravação de vídeo/prints ==="
            maestro test .maestro/ -e LOGIN="$LOGIN" -e SENHA="$SENHA" -e LOGIN2="$LOGIN2" -e SENHA2="$SENHA2" --format junit --output $RESULTS_DIR/output.xml --test-output-dir $RESULTS_DIR || true

      - name: Coletar Evidências (Screenshots e Logs)
        if: always()
        run: |
          mkdir -p $RESULTS_DIR
          find ~/.maestro -type f \( -name "*.png" -o -name "*.mp4" -o -name "*.log" \) -exec cp {} $RESULTS_DIR/ 2>/dev/null || true
          find $RESULTS_DIR -mindepth 2 -type f \( -name "*.png" -o -name "*.mp4" -o -name "*.log" \) -exec cp {} $RESULTS_DIR/ 2>/dev/null || true

      - name: Limpar APKs do Workspace para liberar espaço
        if: always()
        run: |
          rm -rf app/apks/

      - name: Extrair Métricas e Gerar Relatório HTML
        if: always()
        id: metrics
        shell: python
        run: |
          import os
          import glob
          import html
          import xml.etree.ElementTree as ET
          from datetime import datetime
          import zoneinfo

          results_dir = os.environ.get("RESULTS_DIR", "results")
          output_file = os.path.join(results_dir, "output.xml")
          passed, failed, skipped = 0, 0, 0
          errors_list = []
          rows_html = []

          if os.path.exists(output_file) and os.path.getsize(output_file) > 0:
              try:
                  tree = ET.parse(output_file)
                  root = tree.getroot()
                  for tc in root.findall(".//testcase"):
                      name = tc.get("name", "Unknown Flow")
                      time_sec = tc.get("time", "0")
                      failure = tc.find("failure")
                      if failure is None:
                          failure = tc.find("error")

                      if failure is None:
                          passed += 1
                          rows_html.append(f"<tr><td>✅ PASS</td><td>{html.escape(name)}</td><td>{time_sec}s</td><td>-</td></tr>")
                      else:
                          failed += 1
                          err_msg = (failure.text or failure.get("message") or "Falha sem detalhes").replace("\n", " ").replace("\r", "").strip()
                          errors_list.append(f"<li><strong>{html.escape(name)}:</strong> {html.escape(err_msg)}</li>")
                          rows_html.append(f"<tr style='background:#ffebee'><td>❌ FAIL</td><td>{html.escape(name)}</td><td>{time_sec}s</td><td>{html.escape(err_msg)}</td></tr>")
              except Exception as e:
                  failed = 1
                  err_msg = f"Erro ao processar XML JUnit: {str(e)}"
                  errors_list.append(f"<li>{html.escape(err_msg)}</li>")
          else:
              failed = 1
              errors_list.append("<li>Arquivo output.xml não foi gerado pelo Maestro.</li>")

          total = passed + failed + skipped
          error_details = "".join(errors_list) if errors_list else "Nenhuma falha crítica registrada."
          status_str = "Monitoramento Finalizado com Sucesso" if failed == 0 and total > 0 else "FALHOU ❌"
          status_raw = "success" if failed == 0 and total > 0 else "failure"

          sp_tz = zoneinfo.ZoneInfo("America/Sao_Paulo")
          now_str = datetime.now(sp_tz).strftime("%d/%m/%Y às %H:%M")

          # Gera um index.html leve para visualização rápida no R2
          png_files = sorted([os.path.basename(p) for p in glob.glob(os.path.join(results_dir, "*.png"))])
          imgs_html = "".join([f"<div style='margin:15px 0'><p><strong>{p}</strong></p><img src='./{p}' style='max-width:340px;border:1px solid #ccc;border-radius:6px'/></div>" for p in png_files])

          os.makedirs(results_dir, exist_ok=True)
          with open(os.path.join(results_dir, "index.html"), "w", encoding="utf-8") as rep:
              rep.write(f"""<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório Maestro - Run #{os.environ.get('GITHUB_RUN_NUMBER')}</title>
              <style>body{{font-family:Arial,sans-serif;padding:24px;background:#f6f8fa}}table{{width:100%;border-collapse:collapse;background:#fff}}th,td{{padding:10px;border:1px solid #ddd;text-align:left}}th{{background:#24292f;color:#fff}}</style></head>
              <body><h2>Relatório de Execução Maestro — Run #{os.environ.get('GITHUB_RUN_NUMBER')} ({now_str})</h2>
              <p><strong>Passed:</strong> {passed} | <strong>Failed:</strong> {failed} | <strong>Total:</strong> {total}</p>
              <table><thead><tr><th>Status</th><th>Fluxo</th><th>Duração</th><th>Detalhes</th></tr></thead><tbody>{''.join(rows_html)}</tbody></table>
              <h3>Evidências Capturadas</h3>{imgs_html if imgs_html else '<p>Nenhuma imagem anexada.</p>'}</body></html>""")

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"passed={passed}\n")
              f.write(f"failed={failed}\n")
              f.write(f"skipped={skipped}\n")
              f.write(f"total={total}\n")
              f.write(f"status={status_str}\n")
              f.write(f"status_raw={status_raw}\n")
              f.write(f"datetime={now_str}\n")
              f.write(f"errors={error_details}\n")

      - name: Extrair Evidências (print) de Falhas
        if: always()
        id: evidence
        shell: python
        run: |
          import glob
          import os
          screenshot_link = ""
          base_url = f"{os.environ.get('R2_PUBLIC_URL')}/reports/maestro-run-${{ github.run_number }}"
          results_dir = os.environ.get("RESULTS_DIR", "results")

          png_files = glob.glob(os.path.join(results_dir, "*.png"))
          if png_files:
              png_files.sort(key=os.path.getmtime, reverse=True)
              filename = os.path.basename(png_files[0])
              screenshot_link = f"{base_url}/{filename}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"screenshot_link={screenshot_link}\n")

      - name: Deploy do Relatório para Cloudflare R2
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync $RESULTS_DIR/ s3://${{ env.R2_BUCKET }}/reports/maestro-run-${{ github.run_number }} \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: Enviar resultados para o Dashboard (Apps Script)
        if: always()
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          R2_PUBLIC_URL: ${{ env.R2_PUBLIC_URL }}
          RESULTS_DIR: ${{ env.RESULTS_DIR }}
        run: |
          npm install xml2js
          node scripts/enviar-resultados-appscript-maestro.js

      - name: Upload dos Artefatos de Evidência (Prints e Vídeos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-evidencias-run-${{ github.run_number }}
          path: ${{ env.RESULTS_DIR }}
          retention-days: 7

      - name: GitHub Summary
        if: always()
        run: |
          REPORT_URL="${{ env.R2_PUBLIC_URL }}/reports/maestro-run-${{ github.run_number }}/index.html"
          echo "## ${{ steps.metrics.outputs.status }} — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "| | Qtd |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed  | ${{ steps.metrics.outputs.passed }}  |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed  | ${{ steps.metrics.outputs.failed }}  |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔢 Total   | ${{ steps.metrics.outputs.total }}   |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Ver Relatório Completo]($REPORT_URL)" >> $GITHUB_STEP_SUMMARY

      - name: Enviar E-mail de Sucesso
        if: always() && steps.metrics.outputs.status_raw == 'success'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅[TESTE MOBILE MAESTRO] Wemobi/UTP - Monit. Cont."
          to: anderson.ssantos@jcatlm.com.br
          from: "Monitoramento Contínuo"
          html_body: |
            <!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
            <style>
              body{font-family:Arial,sans-serif;background:#f4f4f4;padding:20px}
              .wrap{max-width:620px;margin:auto;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
              .hdr{padding:28px 32px;text-align:center}
              .hdr.ok{background:#1a7f37}
              .hdr h1{color:#fff;margin:0;font-size:24px}
              .hdr p{color:rgba(255,255,255,.8);margin:6px 0 0;font-size:13px}
              .body{padding:28px 32px}
              .cards{display:flex;gap:10px;margin-bottom:24px}
              .card{flex:1;text-align:center;padding:16px 6px;border-radius:6px;background:#f6f8fa;border:1px solid #e1e4e8}
              .card .n{font-size:28px;font-weight:800;display:block}
              .card .l{font-size:11px;color:#57606a;margin-top:4px}
              .green{color:#1a7f37}.red{color:#cf222e}.blue{color:#0969da}
              a.btn{display:block;text-align:center;padding:13px;border-radius:6px;text-decoration:none;font-weight:700;font-size:14px;margin-bottom:10px}
              .btn-gray{background:#f6f8fa;color:#24292f;border:1px solid #d0d7de}
              .footer{background:#f6f8fa;border-top:1px solid #e1e4e8;padding:14px 32px;text-align:center;font-size:11px;color:#8c959f}
            </style></head><body>
            <div class="wrap">
              <div class="hdr ok">
                <h1>${{ steps.metrics.outputs.status }}</h1>
                <p>Run #${{ github.run_number }} · ${{ steps.metrics.outputs.datetime }}</p>
              </div>
              <div class="body">
                <div class="cards">
                  <div class="card"><span class="n green">${{ steps.metrics.outputs.passed }}</span><div class="l">✅ Passed</div></div>
                  <div class="card"><span class="n red">${{ steps.metrics.outputs.failed }}</span><div class="l">❌ Failed</div></div>
                  <div class="card"><span class="n blue">${{ steps.metrics.outputs.total }}</span><div class="l">🔢 Total</div></div>
                </div>
                <a class="btn btn-gray" href="${{ env.R2_PUBLIC_URL }}/reports/maestro-run-${{ github.run_number }}/index.html">📄 Ver Relatório (HTML)</a>
                <a class="btn btn-gray" href="https://script.google.com/macros/s/AKfycby6v2p1_k9ch5st11OeBy7Nermci8fIh0Y9A4RwroXO5HdIsGDF03BUg6hgHVsFou6_1A/exec">📊 Abrir Dashboard</a>
                <a class="btn btn-gray" href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">⚙️ Ver Execução no GitHub Actions</a>
              </div>
              <div class="footer">Gerado automaticamente · Não responda este e-mail</div>
            </div></body></html>

      - name: Enviar E-mail de Falha
        if: always() && steps.metrics.outputs.status_raw == 'failure'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚨[TESTE ALERTA MOBILE MAESTRO] Wemobi/UTP - Monit. Cont"
          to: anderson.ssantos@jcatlm.com.br
          from: "Monitoramento Contínuo"
          attachments: results/*.png
          html_body: |
            <!DOCTYPE html>
            <html lang="pt-BR">
            <head>
              <meta charset="UTF-8">
              <style>
                body{font-family:Arial,sans-serif;background:#f4f4f4;padding:20px}
                .wrap{max-width:620px;margin:auto;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
                .hdr{padding:28px 32px;text-align:center}
                .hdr.fail{background:#cf222e}
                .hdr h1{color:#fff;margin:0;font-size:24px}
                .hdr p{color:rgba(255,255,255,.8);margin:6px 0 0;font-size:13px}
                .body{padding:28px 32px}
                .alert-box{background-color:#fff9c4;border:1px solid #fbc02d;padding:16px;border-radius:6px;margin-bottom:24px;font-size:14px;color:#24292f}
                .alert-box h3{margin:0 0 8px 0;color:#d32f2f;font-size:16px}
                .alert-box ul{margin:8px 0 0 0;padding-left:20px;color:#57606a}
                .alert-box li{margin-bottom:6px}
                .cards{display:flex;gap:10px;margin-bottom:24px}
                .card{flex:1;text-align:center;padding:16px 6px;border-radius:6px;background:#f6f8fa;border:1px solid #e1e4e8}
                .card .n{font-size:28px;font-weight:800;display:block}
                .card .l{font-size:11px;color:#57606a;margin-top:4px}
                .green{color:#1a7f37}.red{color:#cf222e}.blue{color:#0969da}
                a.btn{display:block;text-align:center;padding:13px;border-radius:6px;text-decoration:none;font-weight:700;font-size:14px;margin-bottom:10px}
                .btn-gray{background:#f6f8fa;color:#24292f;border:1px solid #d0d7de}
                .footer{background:#f6f8fa;border-top:1px solid #e1e4e8;padding:14px 32px;text-align:center;font-size:11px;color:#8c959f}
              </style>
            </head>
            <body>
              <div class="wrap">
                <div class="hdr fail">
                  <h1>🚨 ${{ steps.metrics.outputs.status }}</h1>
                  <p>Run #${{ github.run_number }} · ${{ steps.metrics.outputs.datetime }}</p>
                </div>
                <div class="body">
                  <div class="alert-box">
                    <h3>⚠️ Falha Detectada no Monitoramento Mobile (Maestro)</h3>
                    O teste automatizado encontrou um erro durante a execução.
                    <strong>Falhas registradas:</strong>
                    <ul>
                      ${{ steps.metrics.outputs.errors }}
                    </ul>
                  </div>
                  <div class="cards">
                    <div class="card"><span class="n green">${{ steps.metrics.outputs.passed }}</span><div class="l">✅ Passed</div></div>
                    <div class="card"><span class="n red">${{ steps.metrics.outputs.failed }}</span><div class="l">❌ Failed</div></div>
                    <div class="card"><span class="n blue">${{ steps.metrics.outputs.total }}</span><div class="l">🔢 Total</div></div>
                  </div>
                  <a class="btn btn-gray" href="${{ env.R2_PUBLIC_URL }}/reports/maestro-run-${{ github.run_number }}/index.html">📄 Analisar Relatório de Erro (HTML)</a>
                  <a class="btn btn-gray" href="https://script.google.com/macros/s/AKfycby6v2p1_k9ch5st11OeBy7Nermci8fIh0Y9A4RwroXO5HdIsGDF03BUg6hgHVsFou6_1A/exec">📊 Abrir Dashboard</a>
                  ${{ steps.evidence.outputs.screenshot_link && format('<a class="btn btn-gray" href="{0}">🖼️ Ver Print da Tela de Erro</a>', steps.evidence.outputs.screenshot_link) }}
                  <a class="btn btn-gray" href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">⚙️ Ver Log Completo no GitHub Actions</a>
                </div>
                <div class="footer">Gerado automaticamente · Não responda este e-mail</div>
              </div>
            </body>
            </html>
