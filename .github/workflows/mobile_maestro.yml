name: Mobile Maestro E2E

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RESULTS_DIR: results
  R2_PUBLIC_URL: "https://pub-8f8304dd624445aca80dcb98bc5a78d0.r2.dev"

jobs:
  maestro-mobile-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Enable KVM group permissions
        run: |
          sudo chmod 666 /dev/kvm

      - name: Run Tests with Android Emulator & Maestro
        id: run_tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LOGIN: ${{ secrets.LOGIN }}
          SENHA: ${{ secrets.SENHA }}
          LOGIN2: ${{ secrets.LOGIN2 }}
          SENHA2: ${{ secrets.SENHA2 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            export PATH="$PATH:$HOME/.maestro/bin"
            echo "=== Instalando APKs ==="
            adb install-multiple ./app/apks/cometa/*.apk || true
            adb install-multiple ./app/apks/1001/*.apk || true

            mkdir -p $RESULTS_DIR

            echo "=== Executando Maestro com gravação de vídeo/prints ==="
            maestro test .maestro/ -e LOGIN="$LOGIN" -e SENHA="$SENHA" -e LOGIN2="$LOGIN2" -e SENHA2="$SENHA2" --format junit --output $RESULTS_DIR/output.xml --test-output-dir $RESULTS_DIR || true

      - name: Coletar Evidências (Screenshots e Logs)
        if: always()
        run: |
          # Copia qualquer evidência gerada pelo Maestro para a pasta results
          find ~/.maestro -type f \( -name "*.png" -o -name "*.mp4" -o -name "*.log" \) -exec cp {} $RESULTS_DIR/ 2>/dev/null || true
          find . -name "*.png" -exec cp {} $RESULTS_DIR/ 2>/dev/null || true

      - name: Upload dos Artefatos de Evidência (Prints e Vídeos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-evidencias-run-${{ github.run_number }}
          path: ${{ env.RESULTS_DIR }}
          retention-days: 7

      - name: GitHub Summary
        if: always()
        run: |
          echo "## Maestro Execution Summary — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "📥 Baixe os artefatos na aba **Actions > Run #${{ github.run_number }} > Artifacts** para ver os prints e relatórios detalhados da falha." >> $GITHUB_STEP_SUMMARY
