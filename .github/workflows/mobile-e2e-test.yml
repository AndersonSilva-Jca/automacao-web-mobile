name: TESTE Mobile E2E - Giro/Wemobi/UTP

on:
  # schedule:
  #   - cron: "30 0-22/2 * * *"
  #   - cron: "30 1-23/2 * * *"
  workflow_dispatch:

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

env:
  RESULTS_DIR: results
  ALLURE_DIR: allure-results

jobs:
  mobile-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-robotframework robotframework-appiumlibrary allure-python-commons robotframework-imaplibrary2

      - name: Install Allure CLI
        run: |
          wget -qO allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          sudo tar -xzf allure.tgz -C /opt
          sudo ln -s /opt/allure-2.27.0/bin/allure /usr/local/bin/allure
          allure --version

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Appium drivers
        uses: actions/cache@v4
        with:
          path: ~/.appium
          key: ${{ runner.os }}-appium-uiautomator2-v2

      - name: Install Appium + uiautomator2
        run: |
          npm install -g appium
          appium driver install uiautomator2 || true

      - name: Enable KVM group permissions
        run: |
          sudo chmod 666 /dev/kvm

      - name: Start Appium
        shell: bash
        run: |
          appium \
            --allow-insecure chromedriver_autodownload \
            --relaxed-security \
            --log appium.log > appium.log 2>&1 &

          echo $! > appium.pid

          timeout 90 bash -c '
            until curl -s http://127.0.0.1:4723/status | grep -q "\"ready\":true"
            do
              sleep 2
            done
          '
          curl http://127.0.0.1:4723/status

      - name: Run Tests with Android Emulator
        id: run_tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LOGIN: ${{ secrets.LOGIN }}
          SENHA: ${{ secrets.SENHA }}
          LOGIN2: ${{ secrets.LOGIN2 }}
          SENHA2: ${{ secrets.SENHA2 }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REMETENTE_APP: ${{ secrets.REMETENTE_APP }}
          WA_PHONE_ALFREDO: ${{ secrets.WA_PHONE_ALFREDO }}
          WA_PHONE_ANDERSON: ${{ secrets.WA_PHONE_ANDERSON }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_headless -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            echo "=== Emulator pronto e bootado automaticamente pela Action ==="
            adb devices

            echo "Instalando o aplicativo Clube Giro..."
            adb install-multiple ./app/apks/clube_giro/*.apk || true

            echo "Instalando os demais aplicativos..."
            adb install-multiple ./app/apks/wemobi/*.apk || true
            adb install-multiple ./app/apks/cometa/*.apk || true
            adb install-multiple ./app/apks/1001/*.apk || true
            adb install-multiple ./app/apks/catarinense/*.apk || true

            echo "Desativando animações do sistema..."
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

            mkdir -p $RESULTS_DIR $ALLURE_DIR

            echo "Iniciando a execução do Robot Framework..."
            robot -T -d ./results --listener allure_robotframework:$ALLURE_DIR --name "Monitoramento Mobile" app/appGiro/giro_login.robot

      - name: Limpar APKs do Workspace
        if: always()
        run: rm -rf app/apks/

      - name: Remover vídeos de execuções bem-sucedidas
        if: steps.run_tests.outcome == 'success'
        run: |
          find $ALLURE_DIR -type f \( -name "*.mp4" -o -name "*.webm" \) -delete 2>/dev/null || true
          find $RESULTS_DIR -type f \( -name "*.mp4" -o -name "*.webm" \) -delete 2>/dev/null || true

      - name: Gera relatório Allure
        if: always()
        run: |
          if [ -d "$ALLURE_DIR" ] && [ "$(ls -A $ALLURE_DIR 2>/dev/null)" ]; then
            allure generate $ALLURE_DIR --clean -o allure-report
          else
            mkdir -p allure-report
            echo "<html><body><h2>Sem dados de teste — emulador ou Appium falhou.</h2></body></html>" > allure-report/index.html
          fi

      - name: Obter Data e Hora Atual (Brasília)
        if: failure()
        run: |
          echo "DATA_ALERTA=$(TZ='America/Sao_Paulo' date +'%d/%m/%Y')" >> $GITHUB_ENV
          echo "HORA_ALERTA=$(TZ='America/Sao_Paulo' date +'%H:%M:%S')" >> $GITHUB_ENV

      - name: Limpar Relatórios Antigos (>5 dias)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repo-pages || exit 0

          if [ "${{ steps.run_tests.outcome }}" = "success" ]; then
            rm -rf results/*.png results/*.mp4 || true
          fi

          cd repo-pages
          if [ -d "reports" ]; then
            CUTOFF=$(date -d '5 days ago' +%s)
            for dir in reports/mobile-run-*/; do
              dir=${dir%/}
              [ -d "$dir" ] || continue
              last_commit=$(git log -1 --format=%ct -- "$dir")
              if [ -n "$last_commit" ] && [ "$last_commit" -lt "$CUTOFF" ]; then
                rm -rf "$dir"
              fi
            done
            if [ -n "$(git status --porcelain)" ]; then
              git add .
              git commit -m "ci: faxina programada automática Mobile (>5 dias)"
              git push origin gh-pages
            fi
          fi

      - name: Deploy do Relatório para GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: reports/mobile-run-${{ github.run_number }}
          keep_files: true
          enable_jekyll: false
          commit_message: "ci: deploy report mobile run ${{ github.run_number }}"

      - name: Stop Appium
        if: always()
        run: |
          if [ -f appium.pid ]; then
            kill "$(cat appium.pid)" 2>/dev/null || true
          fi

      - name: Upload Artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results-run-${{ github.run_number }}
          path: ${{ env.RESULTS_DIR }}
          retention-days: 7

      - name: Extrair métricas
        if: always()
        id: metrics
        shell: python
        run: |
          import os
          import xml.etree.ElementTree as ET
          from datetime import datetime
          import zoneinfo

          results_dir = os.environ.get("RESULTS_DIR", "results")
          passed, failed, skipped = 0, 0, 0
          error_details = "Nenhuma falha crítica registrada."

          output_file = None
          if os.path.exists(results_dir):
              for f in os.listdir(results_dir):
                  if f.startswith("output") and f.endswith(".xml"):
                      output_file = os.path.join(results_dir, f)
                      break

          if output_file and os.path.getsize(output_file) > 0:
              try:
                  tree = ET.parse(output_file)
                  root = tree.getroot()
                  stat_elem = root.find(".//total/stat")
                  if stat_elem is not None:
                      passed = int(stat_elem.get("pass", 0))
                      failed = int(stat_elem.get("fail", 0))
                      skipped = int(stat_elem.get("skip", 0))

                  if failed > 0:
                      errors_list = []
                      for test in root.findall(".//test"):
                          status = test.find("status")
                          if status is not None and status.get("status") == "FAIL":
                              test_name = test.get("name", "Unknown Test")
                              err_msg = status.text if status.text else "Sem mensagem."
                              err_msg = err_msg.replace("\n", " ").replace("\r", "").strip()
                              errors_list.append(f"<li><strong>{test_name}:</strong> {err_msg}</li>")
                      if errors_list:
                          error_details = "".join(errors_list)
              except Exception as e:
                  error_details = f"<li>Erro ao ler XML: {str(e)}</li>"
                  failed = 1

          total = passed + failed + skipped
          status_str = "Monitoramento Finalizado com Sucesso" if failed == 0 and total > 0 else "FALHOU ❌"
          status_raw = "success" if failed == 0 and total > 0 else "failure"

          sp_tz = zoneinfo.ZoneInfo("America/Sao_Paulo")
          now_str = datetime.now(sp_tz).strftime("%d/%m/%Y às %H:%M")

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"passed={passed}\n")
              f.write(f"failed={failed}\n")
              f.write(f"skipped={skipped}\n")
              f.write(f"total={total}\n")
              f.write(f"status={status_str}\n")
              f.write(f"status_raw={status_raw}\n")
              f.write(f"datetime={now_str}\n")
              f.write(f"errors={error_details}\n")

      - name: Enviar E-mail de Sucesso
        if: success()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅[MOBILE] Giro/Wemobi/UTP - Monit. Cont."
          to: anderson.ssantos@jcatlm.com.br
          from: "Monitoramento Contínuo"
          html_body: |
            <h2>Execution #${{ github.run_number }} Passed</h2>
            <p>Data: ${{ steps.metrics.outputs.datetime }}</p>

      - name: Enviar E-mail de Falha
        if: failure()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚨[ALERTA MOBILE] Giro/Wemobi/UTP - Monit. Cont"
          to: anderson.ssantos@jcatlm.com.br
          from: "Monitoramento Contínuo"
          html_body: |
            <h2>🚨 ${{ steps.metrics.outputs.status }}</h2>
            <p>Run #${{ github.run_number }} · ${{ steps.metrics.outputs.datetime }}</p>
            <ul>${{ steps.metrics.outputs.errors }}</ul>
