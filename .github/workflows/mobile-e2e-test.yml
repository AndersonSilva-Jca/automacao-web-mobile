name: Mobile E2E - Clube Giro - BrowserStack

on:
  workflow_dispatch:
  # Ative depois que a execução manual estiver estável:
  # schedule:
  #   - cron: "0 * * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RESULTS_DIR: results
  ALLURE_DIR: allure-results
  ALLURE_REPORT_DIR: allure-report

  # Device inicial. Depois você pode trocar sem alterar o Robot.
  BS_DEVICE: "Samsung Galaxy S23"
  BS_OS_VERSION: "13.0"

  # Mantido porque seu projeto já publica Allure no R2.
  R2_PUBLIC_URL: "https://pub-8f8304dd624445aca80dcb98bc5a78d0.r2.dev"

jobs:
  mobile-browserstack:
    name: Robot + BrowserStack
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      id-token: write

    env:
      # BrowserStack
      BS_USERNAME: ${{ secrets.BS_USERNAME }}
      BS_ACCESS_KEY: ${{ secrets.BS_ACCESS_KEY }}

      # OBRIGATÓRIO: app_url do BrowserStack (bs://...)
      BS_APP: ${{ secrets.BS_APP }}
      BS_BUILD_NAME: "Clube Giro CI - Run #${{ github.run_number }}"

      # Aplicação / 2FA
      LOGIN2: ${{ secrets.LOGIN2 }}
      SENHA2: ${{ secrets.SENHA2 }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
      REMETENTE_APP: ${{ secrets.REMETENTE_APP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install \
            allure-robotframework \
            robotframework-appiumlibrary \
            robotframework-imaplibrary2 \
            python-dotenv

      - name: Validar configuração BrowserStack
        shell: bash
        run: |
          test -n "$BS_USERNAME" || (echo "ERRO: Secret BS_USERNAME ausente" && exit 1)
          test -n "$BS_ACCESS_KEY" || (echo "ERRO: Secret BS_ACCESS_KEY ausente" && exit 1)
          test -n "$BS_APP" || (echo "ERRO: Secret BS_APP ausente. Informe o app_url bs://... do App Automate." && exit 1)

          case "$BS_APP" in
            bs://*) echo "BS_APP válido: ${BS_APP:0:8}***" ;;
            *) echo "ERRO: BS_APP deve começar com bs://"; exit 1 ;;
          esac

          echo "Device: $BS_DEVICE"
          echo "Android: $BS_OS_VERSION"

      - name: Validar credenciais BrowserStack
        shell: bash
        run: |
          HTTP_CODE=$(curl -s -o /tmp/bs.json -w "%{http_code}" \
            -u "$BS_USERNAME:$BS_ACCESS_KEY" \
            "https://api-cloud.browserstack.com/app-automate/recent_apps")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Falha ao autenticar no BrowserStack. HTTP $HTTP_CODE"
            cat /tmp/bs.json || true
            exit 1
          fi

          echo "Autenticação BrowserStack OK."

      - name: Preparar diretórios
        shell: bash
        run: |
          rm -rf "$RESULTS_DIR" "$ALLURE_DIR" "$ALLURE_REPORT_DIR"
          mkdir -p "$RESULTS_DIR" "$ALLURE_DIR"

      - name: Executar Robot no BrowserStack
        id: robot
        continue-on-error: true
        shell: bash
        run: |
          robot \
            --outputdir "$RESULTS_DIR" \
            --output output.xml \
            --log log.html \
            --report report.html \
            --listener "allure_robotframework:$ALLURE_DIR" \
            --name "Monitoramento Clube Giro - BrowserStack" \
            app/appGiro/giro_login.robot

      - name: Extrair métricas
        id: metrics
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          from datetime import datetime
          import zoneinfo
          from robot.api import ExecutionResult

          output = Path(os.environ.get("RESULTS_DIR", "results")) / "output.xml"

          passed = 0
          failed = 1
          skipped = 0
          error_details = "O Robot não gerou output.xml."

          if output.exists() and output.stat().st_size > 0:
              result = ExecutionResult(str(output))
              stats = result.statistics.total
              passed = int(stats.passed)
              failed = int(stats.failed)
              skipped = int(getattr(stats, "skipped", 0))

              errors = []
              for suite in result.suite.suites:
                  for test in suite.tests:
                      if test.status == "FAIL":
                          msg = (test.message or "Sem mensagem detalhada.").replace("\n", " ").strip()
                          errors.append(f"{test.name}: {msg}")
              if errors:
                  error_details = " | ".join(errors)
              elif failed == 0:
                  error_details = "Nenhuma falha."

          total = passed + failed + skipped
          status_raw = "success" if total > 0 and failed == 0 else "failure"
          status = "PASSOU ✅" if status_raw == "success" else "FALHOU ❌"

          now = datetime.now(zoneinfo.ZoneInfo("America/Sao_Paulo")).strftime("%d/%m/%Y às %H:%M")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"passed={passed}\n")
              f.write(f"failed={failed}\n")
              f.write(f"skipped={skipped}\n")
              f.write(f"total={total}\n")
              f.write(f"status_raw={status_raw}\n")
              f.write(f"status={status}\n")
              f.write(f"datetime={now}\n")
              f.write("errors<<EOF\n")
              f.write(error_details + "\n")
              f.write("EOF\n")

      - name: Instalar Allure CLI
        if: always()
        shell: bash
        run: |
          wget -qO allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          sudo tar -xzf allure.tgz -C /opt
          sudo ln -sf /opt/allure-2.27.0/bin/allure /usr/local/bin/allure
          allure --version

      - name: Gerar relatório Allure
        if: always()
        shell: bash
        run: |
          if [ -d "$ALLURE_DIR" ] && [ "$(find "$ALLURE_DIR" -type f | head -1)" ]; then
            allure generate "$ALLURE_DIR" --clean -o "$ALLURE_REPORT_DIR"
          else
            mkdir -p "$ALLURE_REPORT_DIR"
            echo "<html><body><h2>Sem dados Allure para esta execução.</h2></body></html>" \
              > "$ALLURE_REPORT_DIR/index.html"
          fi

      - name: Publicar Allure no Cloudflare R2
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        shell: bash
        run: |
          if [ -n "${{ secrets.R2_ACCESS_KEY_ID }}" ] && \
             [ -n "${{ secrets.R2_SECRET_ACCESS_KEY }}" ] && \
             [ -n "${{ secrets.R2_ACCOUNT_ID }}" ]; then

            aws s3 sync "$ALLURE_REPORT_DIR/" \
              "s3://allure-reports/reports/mobile-run-${{ github.run_number }}" \
              --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          else
            echo "Secrets do R2 não configurados. Publicação ignorada."
          fi

      - name: Upload resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-giro-run-${{ github.run_number }}
          path: |
            results/
            allure-results/
            allure-report/
          retention-days: 14
          if-no-files-found: warn

      - name: GitHub Summary
        if: always()
        shell: bash
        run: |
          REPORT_URL="${R2_PUBLIC_URL}/reports/mobile-run-${{ github.run_number }}/index.html"

          {
            echo "## ${{ steps.metrics.outputs.status }} — Clube Giro / BrowserStack"
            echo ""
            echo "| Resultado | Quantidade |"
            echo "|---|---:|"
            echo "| ✅ Passed | ${{ steps.metrics.outputs.passed }} |"
            echo "| ❌ Failed | ${{ steps.metrics.outputs.failed }} |"
            echo "| ⏭️ Skipped | ${{ steps.metrics.outputs.skipped }} |"
            echo "| 🔢 Total | ${{ steps.metrics.outputs.total }} |"
            echo ""
            echo "📱 Device: $BS_DEVICE / Android $BS_OS_VERSION"
            echo ""
            echo "🔗 BrowserStack: https://app-automate.browserstack.com/dashboard"
            echo ""
            echo "🔗 Allure: $REPORT_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enviar e-mail
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: >-
            ${{ steps.metrics.outputs.status_raw == 'success'
              && '✅ [MOBILE][BROWSERSTACK] Clube Giro - PASSOU'
              || '🚨 [MOBILE][BROWSERSTACK] Clube Giro - FALHOU' }}
          to: anderson.ssantos@jcatlm.com.br
          from: "Monitoramento Contínuo"
          html_body: |
            <!doctype html>
            <html lang="pt-BR">
              <body style="font-family:Arial,sans-serif;background:#f4f4f4;padding:24px">
                <div style="max-width:640px;margin:auto;background:#fff;border-radius:8px;padding:28px">
                  <h2>${{ steps.metrics.outputs.status }}</h2>
                  <p>Run #${{ github.run_number }} · ${{ steps.metrics.outputs.datetime }}</p>

                  <p>
                    ✅ Passed: <strong>${{ steps.metrics.outputs.passed }}</strong><br>
                    ❌ Failed: <strong>${{ steps.metrics.outputs.failed }}</strong><br>
                    🔢 Total: <strong>${{ steps.metrics.outputs.total }}</strong>
                  </p>

                  <p><strong>Device:</strong> ${{ env.BS_DEVICE }} / Android ${{ env.BS_OS_VERSION }}</p>

                  <p><strong>Erro:</strong> ${{ steps.metrics.outputs.errors }}</p>

                  <p>
                    <a href="https://app-automate.browserstack.com/dashboard">📱 BrowserStack App Automate</a>
                  </p>

                  <p>
                    <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">⚙️ GitHub Actions</a>
                  </p>

                  <p>
                    <a href="${{ env.R2_PUBLIC_URL }}/reports/mobile-run-${{ github.run_number }}/index.html">🔍 Allure Report</a>
                  </p>
                </div>
              </body>
            </html>

      - name: Definir status final
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.metrics.outputs.status_raw }}" != "success" ]; then
            echo "A execução do Clube Giro falhou."
            exit 1
          fi

          echo "Clube Giro executado com sucesso no BrowserStack."
